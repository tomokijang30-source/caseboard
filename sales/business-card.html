<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>CaseBoard 명함</title>
<style>
  /* 비즈하우스 가로형 90×50mm 가이드: 92×52mm 작업 (1mm bleed 양옆/위아래) */
  @page { size: 92mm 52mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 92mm; height: 52mm; }
  body {
    font-family: "Malgun Gothic", "맑은 고딕", -apple-system, sans-serif;
    color: #000000;
    background: #ffffff;
    position: relative;
    overflow: hidden;
  }

  /* 실제 cut line은 1mm 안쪽. 안전 영역(safe zone)은 4mm 안쪽 */
  .card {
    position: absolute;
    top: 4mm;
    left: 4mm;
    right: 4mm;
    bottom: 4mm;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* 상단: 브랜드 */
  .brand {
    display: flex;
    align-items: baseline;
    gap: 3mm;
  }
  .brand .logo {
    font-size: 16pt;
    font-weight: 800;
    letter-spacing: -0.4pt;
    color: #000;
    line-height: 1;
  }
  .brand .tagline {
    font-size: 6.2pt;
    color: #000;
    font-weight: 500;
    border-left: 0.4mm solid #000;
    padding-left: 2mm;
    line-height: 1.1;
  }

  /* 중앙: 이름 + 직함 */
  .person {
    margin-top: 2mm;
  }
  .person .name {
    font-size: 14pt;
    font-weight: 700;
    letter-spacing: 1.5pt;
    color: #000;
    line-height: 1;
  }
  .person .role {
    font-size: 7pt;
    color: #000;
    margin-top: 1.2mm;
    font-weight: 500;
  }

  /* 하단: 연락처 */
  .contact {
    font-size: 7.4pt;
    color: #000;
    line-height: 1.45;
    border-top: 0.25mm solid #000;
    padding-top: 1.5mm;
    font-weight: 500;
  }
  .contact .row {
    display: flex;
    align-items: center;
    gap: 2mm;
  }
  .contact .label {
    width: 4mm;
    font-weight: 700;
    font-size: 6.5pt;
  }
</style>
</head>
<body>
<div class="card">

  <!-- 상단 -->
  <div class="brand">
    <div class="logo">CaseBoard</div>
    <div class="tagline">변호사 사무실<br>사건 관리 SaaS</div>
  </div>

  <!-- 중앙 -->
  <div class="person">
    <div class="name">장 유 승</div>
    <div class="role">대표 / Founder</div>
  </div>

  <!-- 하단 -->
  <div class="contact">
    <div class="row"><span class="label">T.</span> 010 · 7647 · 1312</div>
    <div class="row"><span class="label">E.</span> caseboard443@gmail.com</div>
  </div>

</div>
</body>
</html>
