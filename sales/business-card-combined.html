<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>CaseBoard 명함 (앞면+뒷면)</title>
<style>
  @page { size: 92mm 52mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 92mm; }
  body {
    font-family: "Malgun Gothic", "맑은 고딕", -apple-system, sans-serif;
    color: #000000;
    background: #ffffff;
  }
  .page {
    width: 92mm;
    height: 52mm;
    position: relative;
    overflow: hidden;
    page-break-after: always;
  }
  .page:last-child { page-break-after: auto; }

  .card {
    position: absolute;
    top: 4mm; left: 4mm; right: 4mm; bottom: 4mm;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* ===== 앞면 ===== */
  .brand {
    display: flex;
    align-items: baseline;
    gap: 3mm;
  }
  .brand .logo {
    font-size: 16pt; font-weight: 800; letter-spacing: -0.4pt; line-height: 1;
  }
  .brand .tagline {
    font-size: 6.2pt; font-weight: 500;
    border-left: 0.4mm solid #000;
    padding-left: 2mm; line-height: 1.1;
  }
  .person { margin-top: 2mm; }
  .person .name {
    font-size: 14pt; font-weight: 700; letter-spacing: 1.5pt; line-height: 1;
  }
  .person .role {
    font-size: 7pt; margin-top: 1.2mm; font-weight: 500;
  }
  .contact {
    font-size: 7.4pt; line-height: 1.45;
    border-top: 0.25mm solid #000;
    padding-top: 1.5mm; font-weight: 500;
  }
  .contact .row {
    display: flex; align-items: center; gap: 2mm;
  }
  .contact .label {
    width: 4mm; font-weight: 700; font-size: 6.5pt;
  }

  /* ===== 뒷면 ===== */
  .tagline-big {
    text-align: center; margin-top: 1mm;
  }
  .tagline-big .quote {
    font-size: 13pt; font-weight: 800; letter-spacing: -0.4pt; line-height: 1.15;
  }
  .tagline-big .quote .arrow { margin: 0 1mm; font-weight: 600; }
  .tagline-big .sub {
    font-size: 6.6pt; margin-top: 1.2mm; font-weight: 500; letter-spacing: 0.2pt;
  }
  .values {
    display: flex; flex-direction: column; gap: 0.9mm;
    border-top: 0.25mm solid #000;
    border-bottom: 0.25mm solid #000;
    padding: 1.8mm 0;
  }
  .values .row {
    font-size: 7pt; display: flex; align-items: baseline; gap: 1.5mm; line-height: 1.2;
  }
  .values .row .check { font-weight: 800; font-size: 7.2pt; }
  .values .row b { font-weight: 700; }
  .footer-back {
    display: flex; justify-content: space-between; align-items: flex-end;
  }
  .footer-back .price {
    font-size: 7.5pt; font-weight: 700; line-height: 1.25;
  }
  .footer-back .price .small {
    font-size: 6pt; font-weight: 500; margin-top: 0.5mm; display: block;
  }
  .footer-back .brand-mark {
    font-size: 9pt; font-weight: 800; letter-spacing: -0.3pt; text-align: right; line-height: 1;
  }
</style>
</head>
<body>

<!-- ============ 1페이지: 앞면 ============ -->
<div class="page">
  <div class="card">
    <div class="brand">
      <div class="logo">CaseBoard</div>
      <div class="tagline">변호사 사무실<br>사건 관리 SaaS</div>
    </div>
    <div class="person">
      <div class="name">장 유 승</div>
      <div class="role">대표 / Founder</div>
    </div>
    <div class="contact">
      <div class="row"><span class="label">T.</span> 010 · 7647 · 1312</div>
      <div class="row"><span class="label">E.</span> caseboard443@gmail.com</div>
    </div>
  </div>
</div>

<!-- ============ 2페이지: 뒷면 ============ -->
<div class="page">
  <div class="card">
    <div class="tagline-big">
      <div class="quote">매주 1시간 <span class="arrow">→</span> 1초</div>
      <div class="sub">사무장이 직원 진행상황 파악하는 시간</div>
    </div>
    <div class="values">
      <div class="row"><span class="check">✓</span> 직원별 사건 진행상황 <b>화면 1개</b>로</div>
      <div class="row"><span class="check">✓</span> 마감일 임박 사건 <b>자동 상위 정렬</b></div>
      <div class="row"><span class="check">✓</span> 요청 기능 <b>2~3일 내</b> 반영 (큰 SW 못 함)</div>
    </div>
    <div class="footer-back">
      <div class="price">
        월 165,000원
        <span class="small">VAT 포함 · 약정 없음 · 매월 결제</span>
      </div>
      <div class="brand-mark">CaseBoard</div>
    </div>
  </div>
</div>

</body>
</html>
